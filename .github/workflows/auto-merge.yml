name: Auto-merge claude branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/claude/add-contributor-DJC10'
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: claude/add-contributor-DJC10
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge pushed branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Merging $BRANCH into claude/add-contributor-DJC10"
          git fetch origin "$BRANCH"
          git merge "origin/$BRANCH" --no-edit
          git push origin claude/add-contributor-DJC10
